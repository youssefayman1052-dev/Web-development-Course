<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greeting App</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #d6ebff, #c4e0fa);
    }

    .card {
      background: #fff;
      width: 90%;
      max-width: 600px;
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 42px;
      color: #2b2b2b;
    }

    .row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    input {
      flex: 1;
      max-width: 320px;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
    }
    input:focus { border-color: #2196f3; }

    button {
      padding: 12px 22px;
      font-size: 16px;
      color: #fff;
      background: #2196f3;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: #1976d2; }

    ul {
      list-style: none;
      margin: 20px 0 0;
      padding: 0;
    }

    li {
      margin-bottom: 10px;
      padding: 12px;
      font-size: 18px;
      color: #444;
      background: #e3f2fd;
      border-radius: 10px;
      cursor: pointer;
    }
    li:hover { background: #bbdefb; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">HEY THEREE</h1>

    <div class="row">
      <input id="nameinput" type="text" placeholder="Your name">
      <button id="greet">Greet</button>
    </div>

    <ul id="names"></ul>
  </div>

  <script>
  const title = document.getElementById("title");
  const input = document.getElementById("nameinput");
  const greetBtn = document.getElementById("greet");
  const list = document.getElementById("names");

  function greeting() {
    const name = input.value.trim();
    title.textContent = "Hello, " + name;

    const li = document.createElement("li");
    li.textContent = name;

    li.addEventListener("click", function () {
      title.textContent = "Goodbye, " + name + "!";
      li.remove();
    });

    li.addEventListener("click", function (e) {
      console.log(e.target);
    });

    list.appendChild(li);

    input.value = "";
    input.focus();
  }

  greetBtn.addEventListener("click", greeting);
</script>
</body>
</html>
